[project]
name = "regulated-document-builder-demo"
version = "0.1.0"
description = "PDF document builder demo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyMuPDF>=1.23.0",
    "pillow>=11.2.1",
    "python-dotenv>=1.1.0",
    "pyodbc>=5.2.0",
    "python-barcode>=0.16.1",
    "paramiko>=4.0.0",
    "pyqt6>=6.10.2",
]

[project.scripts]
test-record-builder = "test_record_builder.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_record_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ['py312']
